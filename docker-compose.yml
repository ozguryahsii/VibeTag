# Local PostgreSQL, matching what production runs.
#
#   docker compose up -d db
#
# Published on 5433, not 5432. A Mac with Postgres.app or Homebrew's
# postgresql already owns the default port, and the failure when they collide
# is genuinely confusing: the container refuses to start, then Prisma connects
# to the *other* server and reports an authentication error, which reads like
# a credentials problem rather than a port one.
#
# Override with DB_PORT in .env if 5433 is taken too.
#
# Nothing else is containerised for development — Next.js runs on the host so
# hot reload stays instant. This is only here so the database is one command
# instead of an install guide.

services:
  db:
    image: postgres:16-alpine
    container_name: vibetag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibetag
      POSTGRES_PASSWORD: vibetag
      POSTGRES_DB: vibetag
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - vibetag-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `migrate deploy` against a database that is still starting fails in a
      # way that looks like a schema problem, so wait for it to actually answer.
      test: ["CMD-SHELL", "pg_isready -U vibetag -d vibetag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vibetag-pgdata:
