# Local PostgreSQL, matching what production runs.
#
#   docker compose up -d db
#
# Nothing else in the app is containerised for development — Next.js runs on
# the host so hot reload stays instant. This is only here so the database is
# one command instead of an install guide.

services:
  db:
    image: postgres:16-alpine
    container_name: vibetag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibetag
      POSTGRES_PASSWORD: vibetag
      POSTGRES_DB: vibetag
    ports:
      - "5432:5432"
    volumes:
      - vibetag-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `migrate deploy` on a database that is still starting fails in a way
      # that looks like a schema problem, so wait for it to actually answer.
      test: ["CMD-SHELL", "pg_isready -U vibetag -d vibetag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vibetag-pgdata:
